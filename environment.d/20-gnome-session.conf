# Vars that a normal `gnome-session` process — or pam_systemd on a real
# login — would export into the user manager / dbus activation
# environment. We don't run gnome-session here (gnome-shell is launched
# directly with `--mode=user` from a systemd user unit), and lingering
# starts the user manager without going through PAM, so neither of those
# paths plant these vars for us.
#
# Concrete breakage without each var:
#
#   XDG_CURRENT_DESKTOP=GNOME
#     - gnome-control-center (Settings) refuses to start with
#         "Running gnome-control-center is only supported under GNOME
#          and Unity, exiting"
#     - gnome-software, some Adwaita panels, and portals gate behaviour
#       on XDG_CURRENT_DESKTOP and silently degrade or refuse to launch.
#
#   XDG_SESSION_TYPE=wayland
#     - GTK/Qt fall back to X11 detection paths when wayland is unset.
#
#   XDG_SESSION_CLASS=user
#     - localsearch-3.service (Tracker3.Miner.Files dbus name) has
#         ConditionEnvironment=XDG_SESSION_CLASS=user
#       which silently fails when the var is unset on a lingering-only
#       session. systemd reports "skipped, unmet condition check" and
#       hands back to dbus, but the bus name never gets owned — dbus
#       then waits the full 120s service_start_timeout on every
#       activation. gnome-control-center's Search panel hits this on
#       every open, so on Ubuntu Settings appeared to hang for 30-60s
#       before painting. Setting the var lets the service start
#       normally; Ping latency drops from 120000ms to 0ms.
XDG_CURRENT_DESKTOP=GNOME
XDG_SESSION_TYPE=wayland
XDG_SESSION_CLASS=user
