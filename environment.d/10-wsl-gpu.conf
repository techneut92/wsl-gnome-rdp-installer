# Force Mesa's gallium d3d12 driver for all systemd-user services and
# dbus-activated apps in this user session. Without this, client apps
# (terminals, gnome-text-editor, browsers, etc.) probe /dev/dri (absent on
# WSL2), then fall through to llvmpipe — UI feels sluggish and anything
# GPU-heavy crawls. gnome-shell sets this in its own unit; this file
# extends the same selection to every other user-session app so they share
# the GPU via Mesa→D3D12→DXG.
GALLIUM_DRIVER=d3d12
