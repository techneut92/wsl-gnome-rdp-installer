# Pin Xcursor size for X11/Xwayland client apps inside the RDP session.
#
# Wayland-native clients (Firefox, GTK4 apps, mutter itself) render the
# cursor via the compositor and ignore this var. Xwayland clients (CEF
# apps like ONLYOFFICE Desktop Editors, Electron-X11, Java AWT, anything
# that still talks XInput) pull the cursor pixmap via Xcursor, which
# reads XCURSOR_SIZE from env. Mutter scales XCURSOR_SIZE up for HiDPI
# logical-monitor math when the RDP client reports a high-DPI screen,
# and the result is a comically oversized cursor for X11-clients
# (~4x in a typical mstsc-on-HiDPI session).
#
# 24 is GNOME's default and matches org.gnome.desktop.interface.cursor-size.
XCURSOR_SIZE=24
