# Force GTK/GDK apps in the RDP session to use Wayland (wayland-grd),
# never X11. WSLg's interop seeds the per-user environment with
# DISPLAY=:0 pointing at WSLg's host-side X server. Without
# GDK_BACKEND=wayland, GTK auto-detects X11 first and apps end up on the
# Windows desktop instead of inside the RDP session — observed with
# jetbrains-toolbox, which popped its window on the Windows host.
GDK_BACKEND=wayland
