# Vars that a normal `gnome-session` process would export into the user
# manager / dbus activation environment. We don't run gnome-session here
# (gnome-shell is launched directly with `--mode=user` from a systemd user
# unit), so without this file XDG_CURRENT_DESKTOP is unset for everything
# spawned by `systemd --user` and dbus activation.
#
# Concrete breakage without it:
#   - gnome-control-center (Settings) refuses to start with
#       "Running gnome-control-center is only supported under GNOME and
#        Unity, exiting"
#   - gnome-software, some Adwaita panels, and portals gate behaviour on
#     XDG_CURRENT_DESKTOP and silently degrade or refuse to launch.
XDG_CURRENT_DESKTOP=GNOME
XDG_SESSION_TYPE=wayland
