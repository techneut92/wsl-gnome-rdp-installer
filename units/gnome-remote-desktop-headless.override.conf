[Unit]
After=gnome-shell-headless.service pipewire.socket wireplumber.service
Requires=gnome-shell-headless.service
Wants=pipewire.socket wireplumber.service

[Service]
# Force software EGL: WSL2's dzn (DirectX→Vulkan) Mesa stack segfaults
# inside grd_egl_thread_new on the hardware path. Software EGL is stable;
# H.264 encode could still go through NVENC where libnvidia-encode.so.1 is
# available, but with software EGL the capture pipeline doesn't expose
# hardware-accessible textures, so encoding is currently CPU-side.
#
# Drop GALLIUM_DRIVER inherited from the user manager environment
# (~/.config/environment.d/10-wsl-gpu.conf sets GALLIUM_DRIVER=d3d12 to
# accelerate client apps). Inheriting it here makes Mesa fight itself —
# LIBGL_ALWAYS_SOFTWARE=1 + MESA_LOADER_DRIVER_OVERRIDE=swrast +
# GALLIUM_DRIVER=d3d12 lands grd's EGL thread in an undefined state and it
# SIGSEGVs on startup. Unsetting it leaves only the swrast knobs above.
UnsetEnvironment=GALLIUM_DRIVER
Environment="LIBGL_ALWAYS_SOFTWARE=1"
Environment="MESA_LOADER_DRIVER_OVERRIDE=swrast"
Environment="WAYLAND_DISPLAY=wayland-grd"
